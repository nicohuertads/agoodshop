<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgoodShop - Carrito de la compra</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="cabecera">
    <h1>AgoodShop</h1>
  </header>

  <main class="contenedor">
    <section class="productos" aria-label="Productos">
      <div class="fila fila-cabecera">
        <div class="col-producto">Producto</div>
        <div class="col-cantidad">Cantidad</div>
        <div class="col-precio">Pr. Unidad</div>
        <div class="col-total">Total</div>
      </div>
      <p id="mensaje-error" class="error" hidden></p>
      <div id="listado-productos"></div>
    </section>

    <aside class="resumen" aria-label="Resumen del carrito">
      <h2>Total</h2>
      <div id="resumen-lineas"></div>
      <div class="linea-total">
        <span>TOTAL</span>
        <span id="total">0.00€</span>
      </div>
    </aside>
  </main>

  <script src="js/carrito.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
